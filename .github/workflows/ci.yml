name: CI

on:
  push:
    branches: [main, 'feat/**', 'claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (SQLite and PostgreSQL engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Tests, SQLite (local mode)
        run: npm test
      # PGlite is a real PostgreSQL engine running in-process: no service, no secret.
      - name: Tests, PostgreSQL schema and adapter
        run: npm run test:postgres
      - name: Production dependencies have no known high or critical vulnerability
        run: npm audit --omit=dev --audit-level=high
